[project]
name = "jobos"
version = "0.1.0"
description = "A local-first personal AI job application assistant"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "beautifulsoup4==4.15.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "markdown-it-py==4.2.0",
    "playwright==1.61.0",
    "pydantic==2.13.4",
    "pypdf==6.14.2",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.5",
    "sqlalchemy==2.0.51",
    "typer==0.27.0",
    "uvicorn==0.52.0",
]

[project.scripts]
jobos = "jobos.cli:app"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobos"]

[tool.hatch.build.targets.wheel.force-include]
"src/jobos/data/discovery_seed.yaml" = "jobos/data/discovery_seed.yaml"
"src/jobos/data/discovery_seed_enterprise.yaml" = "jobos/data/discovery_seed_enterprise.yaml"
"src/jobos/data/discovery_seed_oracle.yaml" = "jobos/data/discovery_seed_oracle.yaml"

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert with `assert` (S101) and use synchronous pathlib checks inside
# async test functions (ASYNC240); neither warrants production-grade handling here.
"tests/**/*.py" = ["S101", "ASYNC240"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jobos"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
    "types-pyyaml==6.0.12.20260724",
]
