      5,000+ users across authentication, consultations, bookings, chat, wallets, payments, content, campaigns
      and administration; deployed with Docker, EC2, RDS, Lambda, S3, CloudFront and GitHub Actions.
  - id: kh-bedrock-sqs-async-reports
    text: Architected and implemented an asynchronous AI report-generation pipeline using Amazon SQS,
      AWS Lambda, and Amazon Bedrock Claude, decoupling multi-minute LLM inference (~16,000 tokens per
      report) from customer-facing requests and successfully delivering 200+ AI-generated reports in production.
  - id: kh-rag-consultation-orchestration
    text: Built RAG-enabled AI consultation orchestration with custom prompts, scoring algorithms, conversation
      memory and agent workflows, increasing repeat usage by 60% and monetisation.
  - id: kh-seo-static-content-engine
    text: Developed a backend-driven SEO publishing engine that generates optimized static HTML and serves
      it through S3 and CloudFront; optimized single and bulk publishing without N+1 database queries
      to reduce application-server content delivery for 500+ blogs.
  - id: kh-campaign-batch-automation
    text: Built a scheduler for one-time and recurring email campaigns, including Amazon SES batch processing,
      failure/retry logging, channel performance, attribution and conversion reporting for onboarding,
      birthdays, festivals and newsletters.
  - id: kh-wallet-coin-transactions
    text: Designed virtual wallet and coin-based consultation transactions with balance tracking, transaction
      history and failure-aware flows as a foundation for monetization.
  - id: kh-bookings-razorpay-payments
    text: Implemented booking, intent-trigger, Razorpay payment, order-state, email notification and transaction-history
      workflows with failure-aware processing.
  - id: kh-session-auth-security-admin
    text: Implemented session authentication, SSO, CSRF protection, RBAC, audit logging, adaptive rate
      limiting, idempotent APIs, caching, analytics and internal admin tooling, reducing operational effort
      by 90%.
  - id: kh-cloud-health-recovery
    text: Developed multi-layer health monitoring and automated recovery for EC2/Linux, Docker containers,
      Node.js processes and database pools using CloudWatch, periodic health checks, memory logs and failure
      detection.
