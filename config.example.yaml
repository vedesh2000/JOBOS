# Copy to config.yaml and add the career pages you want JobOS to crawl.
data_dir: .jobos
output_dir: output

ai:
  provider: ollama
  # Default uses Ollama's hosted Nemotron model — capable and free to try, with no
  # large download:  `ollama pull nemotron-3-super:cloud`
  # NOTE: ":cloud" models run on Ollama's servers, so the posting text and your
  # resume excerpt leave your machine for that call. For fully local / private use,
  # switch to a local model instead, e.g.:
  #   ollama pull nemotron-mini   (small, ~2.7 GB)  ->  model: nemotron-mini
  #   ollama pull gemma3:12b      (better tailoring) ->  model: gemma3:12b
  # Every AI step has a deterministic fallback, so if the model errors or hits a
  # limit, JobOS still completes — it just produces plainer wording. You can then
  # switch to a local model or an API key on the AI page.
  model: nemotron-3-super:cloud
  base_url: http://127.0.0.1:11434
  temperature: 0.1
  timeout_seconds: 90

  # Efficiency controls, tuned for small local models.
  # Payloads are trimmed to the requirement-dense part of a posting, so raising
  # this mostly costs time without improving results.
  max_input_chars: 6000
  max_output_tokens: 800
  # Only the most job-relevant bullets are sent for rewording. 0 disables rewording.
  max_bullet_rewrites: 6
  # Keeps the model resident between calls so a full run loads weights once.
  keep_alive: 10m

  # Every task has a deterministic fallback, so turning one off degrades quality
  # rather than breaking the workflow. On a 1B model, disabling structure_resume
  # is often better than letting it guess at your resume layout.
  tasks:
    structure_resume: true
    analyse_jobs: true
    rewrite_summary: true
    rewrite_bullets: true
    cover_letter: true

  # Cloud providers are opt-in. Put keys in environment variables, never here:
  # OpenAI: JOBOS_OPENAI_API_KEY
  # Anthropic: JOBOS_ANTHROPIC_API_KEY
  # Gemini: JOBOS_GEMINI_API_KEY
  # OpenRouter: JOBOS_OPENROUTER_API_KEY

crawler:
  concurrency: 5
  per_company_limit: 200
  timeout_seconds: 30
  use_browser_fallback: true
  respect_robots_txt: true

preferences:
  preferred_locations: [Remote, Hyderabad, Bengaluru]
  remote_only: false
  minimum_match_score: 45
  # `search --preferred` applies these together. Title include/exclude and location
  # work on any job; the years window only constrains jobs that have been analysed,
  # so an unanalysed shortlist is never emptied by it.
  roles_include: []              # title must contain one of these (empty = any)
  roles_exclude: []              # title must contain none of these
  # Tech-stack filters. These read the posting's skills, title, description and
  # experience text, matched on whole tokens, so excluding "java" keeps JavaScript
  # roles, and known aliases fold together ("reactjs" counts as react, "k8s" as
  # kubernetes). Terms outside the known vocabulary match literally, so free-form
  # entries like "full stack" work. Ad-hoc equivalents on the CLI:
  #   jobos search --skill python --skill react --exclude-skill "spring boot"
  skills_include: []             # job must mention one of these (empty = any stack)
  skills_exclude: []             # job must mention none of these; exclude beats include
  min_years:                     # lower bound of a job's required years (blank = none)
  max_years:                     # upper bound (blank = none)
  seniority: ""                  # exact seniority for analysed jobs (empty = any)
  # `jobos report` recommends at most this many roles per company, so a limited
  # application quota is spent on the strongest matches.
  max_applications_per_company: 3

# Only these companies are ever crawled. Uncomment or add your own.
# Greenhouse, Lever, Ashby, SmartRecruiters, and Workday boards use their public
# JSON APIs. Anything else falls back to JSON-LD and conservative HTML parsing.
#
# Format:
#   Simple:   stripe: https://boards.greenhouse.io/stripe
#   Extended: microsoft:
#               name: Microsoft
#               url: https://careers.microsoft.com/
#               enabled: true
#
# The India-focused boards below were verified to serve public JSON with
# India-based roles. Company hiring changes over time, so run `jobos crawl` and
# check the counts; remove any that stop returning jobs.
# Uncomment the boards you want. This file ships with none active so JobOS never
# crawls anything you did not choose.
# ---------------------------------------------------------------------------
# PRE-VALIDATED JOB BOARDS (1,100+)
#
# This file ships with 1,100+ real company career boards already configured and
# ACTIVE, so you can crawl immediately instead of building a list from scratch.
# Every board was validated against its ATS's public API for India engineering
# roles (Greenhouse, Lever, Ashby, SmartRecruiters, Workday, Oracle). Many are
# Global Capability Centres (GCCs) of banks, retailers, pharma and industrial
# multinationals.
#
# To use: copy this file to config.yaml, set your resume preferences above, and
# run `jobos crawl --ats fast` (or `jobos crawl-waves`). Remove any board you do
# not want. Company hiring changes over time, so counts in comments are a guide.
# ---------------------------------------------------------------------------
