# JobOS discovery seed - candidate company boards.
#
# These are REAL board slugs taken from public open ATS directories
# (github.com/kalil0321/ats-scrapers) and then probed against each board's own
# public JSON API. Only boards that (a) resolved on a supported ATS, (b) returned
# well-formed JSON, and (c) had at least one India / remote-India posting matching
# the target engineering profile on the probe date are listed here. Nothing is
# invented.
#
# This file is NOT the active registry. `jobos validate-boards` re-validates every
# entry live before anything is written, and `jobos adopt-boards` only ever adds
# boards that still pass. Counts below are from the discovery probe and drift over
# time - they rank where to look, they are not a promise.
#
# Comment columns:  <relevant target-profile India roles> REL / <any India roles> IN
#
# Aggregators, staffing marketplaces and talent pools were excluded, as were boards
# already present in config.yaml.
